name: Saiyan

on:
  schedule:
    - cron: "55 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/saiyan.yml, saiyan/saiyan.py]

permissions:
  contents: write

concurrency: saiyan

jobs:
  saiyan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Draw the blasts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python saiyan/saiyan.py
      - name: Commit the blasts if they changed
        shell: bash
        run: |
          git add saiyan/blasts.svg
          if git diff --cached --quiet; then
            echo "The blasts are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "saiyan: update the blasts"
          git push --quiet