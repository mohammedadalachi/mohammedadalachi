name: Snake

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency: snake

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/snake.svg
            snake/snake-dark.svg?palette=github-dark
      - name: Commit the snake if it changed
        shell: bash
        run: |
          git add snake
          if git diff --cached --quiet; then
            echo "The snake is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "snake: draw the contribution snake"
          git push --quiet